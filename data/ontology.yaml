# Freight LTL planning ontology (prototype v1) — the "context engineering" layer.
# Entities, relationships, constraints and metric definitions the planner, the math
# model and the GenAI explainer all share. Illustrative sample-data prototype.

entities:
  Terminal:
    attrs: [terminal_code, city, type]  # type: breakbulk | eol
    desc: Service center. Breakbulk sorts cross-dock freight; EOL serves local P&D.
  Lane:
    attrs: [terminal_a, terminal_b, miles, cost_per_mile_usd]
    desc: Linehaul lane. cost_per_mile varies by domiciled driver pay + local demographics.
          Lanes over ~250 miles relay at a midpoint so no driver exceeds hours-of-service
          on an out-and-back; see RelayLeg.
  Product:
    values: {P: "Priority - fast, next-day regional", E: "Economy - ~1 day slower"}
  DesignRoute:
    attrs: [origin, dest, product, standard_path, path_type, path_miles]
    desc: "Structured network: every OD x product has ONE standard path we try to follow.
           This is the FREIGHT path (where shipments travel and get handled) - not the
           DRIVER path. path_type 'direct' means no freight handling between origin and
           dest; the DRIVER may still relay (trailer swaps drivers, freight never touches
           the dock). Freight path and driver path are two different things."
  RelayPoint:
    attrs: [relay_id, lane, midpoint_miles]
    desc: Driver swap point on long lanes. The trailer keeps rolling; drivers swap so
          each stays within hours-of-service. No freight handling happens here.
  RelayLeg:
    attrs: [relay_id, from, to, miles, domicile]
    desc: One driver's out-and-back segment of a lane. Each relay-leg turn is domiciled
          at its home end. A lane-turn decomposes into one relay-leg turn per leg.
  HoursOfService:
    desc: Drivers are limited to 11 hours driving. A 350-mile lane is ~6.5h one way,
          so no same-day round trip is legal - the lane relays at midpoint and each
          driver does a ~3.5h out-and-back, home nightly.
  Shipment:
    attrs: [shipment_id, date, customer, origin, dest, product, weight_lbs, pieces,
            density_lb_per_cuft, inferred_cube_cuft, dimmed_cube_cuft, revenue_usd]
    desc: Shippers do NOT provide cube. Planner infers cube at pickup from the
           shipper's historical density profile. Dock dimming gives true cube but
           arrives too late to plan doors/trailers.
  LaneForecast:
    attrs: [date, origin, dest, product, forecast_shipments, forecast_cube_cuft,
            actual_shipments, actual_cube_cuft]
    desc: Lane-level forecast made the prior day; the basis for pre-planning doors/trailers.
  LinehaulActual:  # "layer actuals" - what was dispatched
    attrs: [load_id, lane, direction, bid_id, depart_time, trailer_no, cube_cuft, weight_lbs,
            cube_util_pct, empty, flows]
    desc: Dispatched trailer. empty=true marks a domicile return running empty.
          bid_id + depart_time record which scheduled bid departure the load left on.
  BidConsolidationOpportunity:
    attrs: [opp_id, lane, direction, cycle, detail, pups_early, pups_cut, drivers_now,
            drivers_merged, turns_saved_lane, saving_usd, priority_in_early, service_check]
    desc: "Structural bid-scheduling finding: merging the early bid into the cut saves
          driver shifts. service_check OK = Priority keeps its slack; REVIEW = planner
          decides. Day-specific version runs in the what-if simulator on today's volume."
  OperatingCycle:
    values:
      outbound: "12:00-21:00 — spokes dispatch to their hubs; bids 17:00 and 21:00 cut"
      hub_sort: "21:00-05:00 — breakbulk cross-dock; no scheduled linehaul"
      am: "05:00-12:00 — hubs dispatch to spokes; bids 09:00 and 12:00 cut"
    desc: The rhythm of the night. Every directed lane belongs to exactly one cycle per night;
          freight only leaves when its cycle's bids depart.
  Bid:
    attrs: [bid_id, lane, direction, cycle, depart_time, cut]
    desc: A scheduled driver departure window within a cycle. Drivers bid on start times;
          each bid that carries freight needs ceil(pups_in_bid / 2) drivers (doubles).
          First-leg freight spreads across a cycle's bids as pickups complete; transfer
          freight (already at the hub) rides the first bid. cut=true marks the cycle's
          last departure - the cut time.
  CutTime:
    desc: "The cycle's last bid departure (21:00 outbound, 12:00 AM). Shifting the cut means
          moving an early bid's freight onto the cut departure so one departure does the
          work of two. The optimizer tests exactly this: does merging the early bid into
          the cut save driver shifts WITHOUT harming Priority service?"
  ServiceSlack:
    desc: "Simplified service feasibility for cut shifts (prototype). Priority freight has\n      slack = departure time + drive time to the hub sort vs the 21:00 sort start;\n      if the shift eats the slack, the opportunity is flagged REVIEW for a planner.\n      A cut-time move may NEVER sacrifice product/service feasibility - hard rule."
  Turn:
    desc: Domiciled driver unit. Every dispatch is out-and-back; driver returns to
          home center nightly. turns(direction) = sum over that direction's bids of
          ceil(pups_in_bid / 2) - each bid departure needs its own drivers.
          turns(lane) = max(turns(out), turns(in)), because drivers are domiciled round trips.
          Equipment balances nightly BECAUSE drivers come home.
          On lanes over ~250 miles a lane-turn decomposes into one relay-leg
          turn per leg, each domiciled at its leg's home end. The prototype counts
          lane-turns; production plans relay-leg turns.
  Deviation:
    attrs: [od, product, standard, chosen, reason, saving_usd]
    desc: Cost-driven departure from the standard path. Two kinds only.
  CostToServe:
    attrs: [shipment_id, pud_cost_usd, dock_cost_usd, linehaul_cost_usd,
            cost_to_serve_usd, margin_usd, margin_pct, leg_cost_detail]
    desc: Full cost of a shipment vs what the customer paid.

relationships:
  - Shipment --(origin/dest)--> Terminal
  - Shipment --(product)--> Product
  - Shipment --(assigned)--> LinehaulActual  # via flow segment on a leg
  - DesignRoute --(legs)--> Lane
  - LinehaulActual --(runs on)--> Lane
  - LinehaulActual --(part of)--> Turn
  - Deviation --(overrides)--> DesignRoute

constraints:  # hard rules the math model must respect
  - trailer_cube_cap_cuft: 1750      # 28' pup, illustrative
  - trailer_weight_cap_lbs: 20000
  - pups_per_turn: 2                 # doubles: one driver pulls two pups
  - turn_cube_cap_cuft: 3500         # turn is the cost unit
  - priority_service: "path legs <= 2 AND path miles <= 600"
  - economy_service: "path legs <= 2 AND path miles <= 1000"
  - domicile: "every driver returns to home service center same night; a turn is a ROUND TRIP"
  - relay: "lanes over ~250 miles relay at midpoint: the trailer keeps rolling while
      drivers swap, so each driver stays within 11h hours-of-service. A lane-turn
      decomposes into one relay-leg turn per leg, each domiciled at its home end.
      'Direct' describes the FREIGHT path (no handling); the DRIVER path may still relay."
  - equipment_balance: "pups available at terminal >= pups dispatched (nightly)"
  - bounded_deviation: "daily path choice restricted to pre-approved alternate set (alternate_paths.csv)"
  - cut_service: "a cut-time shift may NEVER sacrifice product/service feasibility. Merging an early
      bid into the cut is allowed only if Priority freight keeps its sort/delivery slack;
      if the shift pushes Priority past the hub sort start (or its simplified commitment),
      the opportunity is flagged REVIEW with the tradeoff priced - a planner decides."

business_rules:  # planner heuristics encoded as context
  - design_horizon: "MONTHLY network design sets standard path + bounded alternates per OD x product"
  - execution_horizon: "DAILY execution starts from standard paths, deviates only on cost"
  - deviation_rule: "Deviate from standard path ONLY to minimize total cost
      (linehaul turns vs dock handles), and ONLY onto a pre-approved alternate.
      Direct a heavy via-hub flow to cut handles; consolidate a light direct flow via hub to gain density."
  - direct_threshold: "consider direct when flow cube >= 60% of a pup"
  - consolidate_threshold: "consider via-hub when direct flow cube < 45% of a pup"
  - cube_first: "a driver turn costs the same full or empty: fill pups on running turns
      before dispatching another driver. Cube utilization is the dominant cost lever."
  - cut_shift_rule: "when freight is thin across a cycle's bids, test merging the early bid into
      the cut: recompute drivers per bid, and if the lane's round-trip staffing (max of directions)
      declines with Priority service preserved, recommend SHIFT CUT - structurally (monthly design)
      or day-specific (today's volume). The same lever runs at both horizons."
  - bid_consolidation: "drivers = ceil(pups_bid / 2) per bid departure, summed per direction, max across
      directions per lane. An early bid with 1 pup still needs its driver; that is the waste the
      cut-time optimizer hunts: two half-full bids -> one full bid, one driver shift saved."
  - cube_rule: "plan on INFERRED cube (pickup estimate); report on DIMMED cube (actual)"
  - empty_rule: "with domiciled doubles, imbalance shows as EMPTY PUP SLOTS on running turns
      (marginal cost ~$0), not empty miles. Charge the waste to the imbalance via cube allocation."
  - tower_rule: "evaluate every tower action NETWORK-WIDE: a cancel must leave room in BOTH
      directions (round trip); a reroute must land in spare pup slots on the alternate path.
      Block locally-cheap moves that hurt the network."
  - relay_rule: "plan TWO networks, not one. The FREIGHT network (shipments, handles,
      breakbulk sorts) decides cost and service. The DRIVER network (relay legs, domiciles,
      hours-of-service) decides who actually drives. A shipment may flow through another
      center even on a 'direct' freight path when the driver needs to get home within hours.
      Price each relay leg at its domicile's $/mi in production; the prototype uses the
      lane's blended $/mi."

metrics:
  cube_utilization_pct:
    def: "loaded cube / pup cube capacity, per leg; cube-weighted network avg"
    good: ">= 85 loaded legs"
  driver_turns:
    def: "turns(direction) = sum over bids of ceil(pups_in_bid / 2); turns(lane) = max over directions"
    note: "the cost unit of linehaul: fixed whether pups are full or empty. On relayed lanes
           (>~250 mi) one lane-turn = one relay-leg turn per leg, each with its own domiciled driver."
  handles_per_shipment:
    def: "dock touches per shipment: 2 direct, 4 via hub"
    lever: "loading directs is the handle-reduction lever"
  empty_pup_pct:
    def: "empty pup slots / total pup slots dispatched"
    note: "with domiciled doubles the waste is density, not miles; goal is efficient, not zero"
  leg_efficiency:
    def: "cost_per_cube_mile_usd = allocated leg cost / (cube x miles)"
    use: "compare legs; high values flag lanes to fix (price, consolidate, direct)"
  mile_verdict:
    good_mile: "linehaul mile at >= 70% cube utilization on a needed lane"
    bad_mile: "empty or < 40% utilized mile"
  cost_to_serve_usd:
    def: "pud_cost + dock_cost + sum of leg allocations by cube share"
    note: "turn cost splits across directions by cube share, so the direction that
           creates imbalance absorbs its empty returns"
  margin: "revenue_usd - cost_to_serve_usd, per shipment / lane / customer / product"
  forecast_mape_pct: "mean absolute % error of lane cube forecast vs actual"

genai_roles:
  plan_explainer:
    desc: "Explain the night's plan in planner language: which deviations, why
           (cost math shown), which legs are bad miles and what drives them."
  deviation_justifier:
    desc: "For each deviation: standard path vs chosen, handles saved/added,
           linehaul delta, net saving. Auditable by network planners."
  cost_to_serve_narrator:
    desc: "Why did this shipment/lane/customer lose money? P&D, dock, leg-level
           linehaul attribution in plain language for pricing decisions."
  tower_copilot:
    desc: "Draft the Central -> service-center message for each tower action:
           what changed, recommended move, network check verdict, cost/service impact.
           Grounded on the tower engine's outputs, never free-form."
  conversational_analyst:
    desc: "Answer planner questions over the scenario data (KPIs, deviations, tower,
           scoreboard, cost-to-serve) using only grounded context. Bring-your-own-key
           LLM; key lives in session/secrets/env, never in the repo."
  cut_time_advisor:
    desc: "Recommend bid/cut adjustments: which lanes could merge an early bid into the cut,
           driver shifts and dollars saved, and the Priority service check (OK vs REVIEW).
           Structural findings come from the monthly design; day-specific versions from the
           what-if simulator. Never recommends a move that sacrifices service."
  exception_copilot:
    desc: "Forecast missed, trailer short, dock door conflict: what broke, options,
           recommended action with cost/service trade-off."
  c_suite_briefer:
    desc: "Network night in 5 bullets: cost, utilization, bad miles, margin, tomorrow's risk."

math_model:  # daily linehaul planning problem (prototype formulation)
  name: "LTL daily load planning: hub-and-spoke, cycles, bid departures, standard paths, network-global tower"
  decide:
    - "path(f) in {standard(f)} U alternates(f) for each OD-product flow f (bounded set)"
    - "turns(l) integer >= 0 for each lane l  [turn = 1 driver, 2 pups, round trip]"
    - "bid staffing: drivers(b) = ceil(pups_in_bid(b) / 2) per scheduled bid departure b"
    - "assignment of flow segments to pups on each directed leg and bid"
  minimize: "sum_l turns(l) x turn_cost(l) + sum_shipments handles(s) x dock_cost"
  subject_to:
    - "pup cube (1750 cu ft) and weight capacity"
    - "service windows by product (above); cut-time shifts never sacrifice feasibility"
    - "domicile round trips: turns(direction) = sum_bids ceil(pups_bid/2);
       turns(l) = max(turns_AB, turns_BA); equipment conserved nightly"
    - "deviations restricted to pre-approved alternate set"
    - "flow conservation at breakbulk; freight available when its cycle's bid departs"
  cut_optimizer: "for each directed lane: test merging the early bid into the cut.
    Recommend SHIFT CUT only if lane round-trip staffing (max of directions) declines
    AND Priority service slack survives (OK); else flag REVIEW with tradeoff priced.
    Runs structurally (monthly design) and day-specifically (simulator volume)."
  tower_engine: "at each checkpoint, project turns vs plan per lane-direction;
    surge -> min(add turn, reroute overflow into spare pup slots on alternate);
    shortfall -> cancel only if BOTH directions keep room (round-trip coupling),
    else BLOCK. Prototype: transparent rules; production: network MIP."
  method_prototype: "greedy deviation search on standard-path start (transparent,
    every move auditable); production: MIP (Gurobi/OR-Tools) or learned optimizer"

tech_stack_to_implement:
  - "data: shipment events, dimming feed, telematics, dock systems -> feature store"
  - "forecast: lane-level hierarchical model (shipments, weight, cube); track MAPE"
  - "cube inference: shipper density profiles refreshed from dimming actuals"
  - "optimizer: MIP for nightly plan; ML optimization proxy (Mak et al. 2023) for speed"
  - "context/ontology: this file - constraints and rules as machine-readable context"
  - "genai: LLM explainer grounded on optimizer outputs + ontology (no free-form numbers)"
  - "app: planner UI (network map, load plan, deviations, cost-to-serve) + exec dashboard"
